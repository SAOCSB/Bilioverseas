name: iOS Build

on:
  push:
    branches: ['**', '!ci-smoke']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; jobs that publish (Release asset, ci-smoke branch) ask for write themselves.
permissions:
  contents: read

jobs:
  core-tests:
    name: Core unit tests (swift test)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: swift test
        run: |
          set +e
          swift test > swift-test.log 2>&1
          STATUS=$?
          tail -40 swift-test.log
          exit $STATUS
      - name: Show errors
        if: failure()
        run: |
          grep -E "error:|failed" swift-test.log | sort -u | head -300 || true

  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write # softprops/action-gh-release attaches the IPA to the Release on v* tags
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (iphoneos, unsigned)
        run: |
          set +e
          xcodebuild \
            -project BiliOverseas.xcodeproj \
            -scheme BiliOverseas \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          STATUS=$?
          grep -E "\*\* BUILD" build.log || tail -50 build.log
          exit $STATUS
      - name: Show compile errors
        if: failure()
        run: |
          grep -E "error:" build.log | sort -u | head -300 || true
      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/BiliOverseas.app
          test -d "$APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist && zip -qry BiliOverseas-unsigned.ipa Payload && ls -lh BiliOverseas-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: BiliOverseas-unsigned-ipa
          path: dist/BiliOverseas-unsigned.ipa
          if-no-files-found: error
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BiliOverseas-unsigned.ipa
          generate_release_notes: true

  simulator-smoke:
    name: Simulator smoke test (real Bilibili, BTR proxy, player)
    runs-on: macos-15
    timeout-minutes: 45
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (iphonesimulator, Debug)
        run: |
          set +e
          xcodebuild \
            -project BiliOverseas.xcodeproj \
            -scheme BiliOverseas \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > sim-build.log 2>&1
          STATUS=$?
          grep -E "\*\* BUILD|error:" sim-build.log | sort -u | head -100
          exit $STATUS
      - name: Boot simulator
        run: |
          xcrun simctl list devices available | grep -E "iPhone" | head -20
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          cands = [x for rt, devs in d.items() if "iOS" in rt for x in devs if x["name"].startswith("iPhone")]
          pref = [x for x in cands if x["name"] in ("iPhone 16 Pro", "iPhone 16", "iPhone 15 Pro", "iPhone 15")]
          print((pref or cands)[0]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Run smoke test
        run: |
          mkdir -p smoke
          APP=build/Build/Products/Debug-iphonesimulator/BiliOverseas.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" io.github.bilioverseas.app -BiliSmokeTest
          # A shot every 7 s, named by UTC time; the report's "screen.*" entries say which screen was up when.
          for i in $(seq 1 30); do
            sleep 7
            xcrun simctl io "$UDID" screenshot "smoke/shot-$(date -u +%H%M%S).png" >/dev/null 2>&1 || true
          done
          DATA=$(xcrun simctl get_app_container "$UDID" io.github.bilioverseas.app data)
          cp "$DATA/Documents/smoke-report.json" smoke/ 2>/dev/null || echo "no report file"
          echo "===== SMOKE REPORT ====="
          cat smoke/smoke-report.json 2>/dev/null || true
          echo "===== SMOKE LOG ====="
          xcrun simctl spawn "$UDID" log show --last 10m --style compact --predicate 'eventMessage CONTAINS "SMOKE"' | tail -400 || true
          echo "===== CRASHES ====="
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i bili || echo "none"
          xcrun simctl spawn "$UDID" launchctl list | grep -i bilioverseas || echo "app process not running (crashed or exited)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-smoke
          path: smoke/
      - name: Publish smoke results to the ci-smoke branch
        if: always() && github.event_name == 'push'
        run: |
          cd smoke || exit 0
          for f in *.png; do [ -e "$f" ] && sips -Z 800 "$f" --out "$f" >/dev/null; done
          echo "${GITHUB_SHA}" > COMMIT
          git init -q -b ci-smoke
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Smoke results for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-smoke || echo "push failed"
