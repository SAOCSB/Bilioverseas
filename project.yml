name: BiliOverseas
options:
  bundleIdPrefix: io.github.bilioverseas
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  BiliOverseas:
    type: application
    platform: iOS
    sources:
      - path: BiliOverseas
        excludes:
          - "**/*.md"
    info:
      path: BiliOverseas/Resources/Info.plist
      properties:
        CFBundleDisplayName: B站海外加速
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh_CN
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - audio
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsLocalNetworking: true
        NSPhotoLibraryAddUsageDescription: 用于保存登录二维码与封面图片到相册
        # bilioverseas://video/BV…, bilioverseas://open?url=<bilibili.com / b23.tv link> (BiliLinkParser).
        CFBundleURLTypes:
          - CFBundleURLName: io.github.bilioverseas.app
            CFBundleURLSchemes:
              - bilioverseas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bilioverseas.app
        PRODUCT_NAME: BiliOverseas
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        # Local device builds: pick your team in Xcode (Signing & Capabilities). CI passes
        # CODE_SIGNING_ALLOWED=NO on the xcodebuild command line for the unsigned IPA.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    scheme:
      gatherCoverageData: false
